query getConsignmentDetailsForMetadataReview($consignmentId: UUID!) {
    getConsignment(consignmentid: $consignmentId) {
        consignmentReference,
        seriesName,
        transferringBodyName,
        userid,
        totalClosedRecords,
        totalRetainedRecords,
        includeTopLevelFolder,
        totalFiles,
        consignmentMetadata {
            propertyName
            value
        }
        metadataReviewLogs {
            metadataReviewLogId
            consignmentId
            userId
            action
            eventTime
            metadataReviewNotes
        }
    }
}
